<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>V4 电商客服多智能体演示</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --muted:#8b93a7; --accent:#4f8cff; --ok:#3fb950; --warn:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 "Segoe UI",system-ui,sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .badge { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
  main { max-width:920px; margin:0 auto; padding:20px 24px 60px; }
  .row { display:flex; gap:8px; margin-bottom:12px; }
  input, textarea, button { font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); padding:10px 12px; }
  textarea { width:100%; min-height:80px; resize:vertical; }
  input { flex:0 0 140px; }
  button { cursor:pointer; background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.ghost { background:transparent; color:var(--fg); border-color:var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #log { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-height:220px; white-space:pre-wrap; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  .node { color:var(--muted); }
  .node b { color:var(--fg); font-weight:600; }
  .intent { color:var(--accent); }
  .tool { color:var(--warn); }
  .answer { color:var(--ok); }
  .blocked { color:#f85149; }
  #approval { display:none; gap:8px; margin:12px 0; }
  #trace { margin-top:12px; color:var(--muted); font-size:12px; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>V4 电商客服多智能体</h1>
  <span class="badge">LangGraph + MCP</span>
  <span class="badge" id="health">检查中…</span>
</header>
<main>
  <div class="row">
    <input id="uid" value="U001" placeholder="user_id" />
    <input id="tid" placeholder="thread_id（留空自动生成）" />
  </div>
  <textarea id="msg" placeholder="例如：订单 SO20260902002 的牛奶变质了，请帮我退款 59.9 元。"></textarea>
  <div class="row" style="margin-top:12px">
    <button id="send">发送</button>
    <button id="clear" class="ghost">清空</button>
  </div>
  <div id="approval">
    <span style="align-self:center;color:var(--warn)">检测到需人工审批：</span>
    <button id="approve">批准</button>
    <button id="reject" class="ghost">驳回</button>
  </div>
  <div id="log"></div>
  <div id="trace"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let threadId = null;

function line(html, cls) {
  const div = document.createElement("div");
  div.className = cls || "";
  div.innerHTML = html;
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
}

async function checkHealth() {
  try {
    const r = await fetch("/ok");
    const d = await r.json();
    $("health").textContent = `服务 ${d.status}｜工具 ${d.tools}`;
  } catch (e) { $("health").textContent = "服务不可用"; }
}

function renderEvent(ev) {
  if (ev.type === "start") { threadId = ev.thread_id; $("tid").value = threadId; return; }
  if (ev.type === "interrupt") { $("approval").style.display = "flex"; line(`⏸ 人工审批：${ev.data.question || JSON.stringify(ev.data)}`, "node"); return; }
  if (ev.type === "blocked") { line(`⛔ 输入被护栏拦截（${ev.category}）`, "blocked"); return; }
  if (ev.type === "answer") {
    line(`\n✅ 最终答复：${ev.answer}`, "answer");
    if (ev.trace) $("trace").textContent = "trace：" + JSON.stringify(ev.trace, null, 2);
    return;
  }
  if (ev.type === "node") {
    if (ev.intent) line(`[supervisor] 路由 → ${ev.intent}`, "node intent");
    (ev.messages || []).forEach(m => {
      if (m.tool_calls) line(`[${ev.node}] 调用工具：${m.tool_calls.map(c => c.name).join(", ")}`, "tool");
      else if (m.content && ev.node !== "supervisor") line(`[${ev.node}] ${m.content.slice(0, 200)}`, "node");
    });
    if (ev.approval_note) line(`[approval] ${ev.approval_note}`, "node");
  }
}

async function stream(url, body) {
  const resp = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const parts = buf.split("\n\n");
    buf = parts.pop();
    for (const part of parts) {
      const dataLine = part.split("\n").find(l => l.startsWith("data: "));
      if (!dataLine) continue;
      const raw = dataLine.slice(6);
      if (raw === "[DONE]") return;
      try { renderEvent(JSON.parse(raw)); } catch (e) {}
    }
  }
}

$("send").onclick = async () => {
  const message = $("msg").value.trim();
  if (!message) return;
  $("log").innerHTML = ""; $("trace").textContent = "";
  $("approval").style.display = "none";
  line(`👤 用户：${message}`, "node");
  await stream("/chat/stream", { message, user_id: $("uid").value || "U001" });
};

$("approve").onclick = () => decide("approve");
$("reject").onclick = () => decide("reject");

async function decide(decision) {
  $("approval").style.display = "none";
  const resp = await fetch("/resume", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ thread_id: threadId, decision }) });
  const d = await resp.json();
  line(`🧑⚖️ 人工${decision === "approve" ? "批准" : "驳回"} → ${d.answer}`, "answer");
  if (d.trace) $("trace").textContent = "trace：" + JSON.stringify(d.trace, null, 2);
}

$("clear").onclick = () => { $("log").innerHTML = ""; $("trace").textContent = ""; $("approval").style.display = "none"; };
checkHealth();
</script>
</body>
</html>
